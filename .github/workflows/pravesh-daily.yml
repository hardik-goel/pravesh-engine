name: Pravesh Daily

on:
  # SAFETY NET, not the schedule. trinetra-backend (lib/praveshTrigger.js) is still the
  # primary trigger and still owns the slot windows; this only covers the days it cannot
  # fire at all.
  #
  # Why it cannot: the backend runs on a free Render instance that sleeps after ~15 minutes
  # idle, and its keep-alive is a SELF-ping — it holds an awake instance awake and cannot
  # wake a sleeping one. So the morning dispatch happens only if something external hits
  # the backend between 09:00 and 10:30 IST. On 2026-08-12 and 2026-08-14 nothing did, and
  # no morning report existed at all.
  #
  # The cron was removed on 2026-08-03 for two reasons, and both are answered here rather
  # than wished away:
  #
  #   * It drifts, badly — that cron fired 3h12m late on 2026-08-03. Which is why these
  #     fire AFTER their window closes and are timed for lateness. A report at noon beats
  #     no report, and nothing here depends on the minute.
  #   * A schedule carries no inputs, so an on-time cron used to deliver a SECOND morning
  #     report on top of the backend's. Now scripts/slot_guard.py runs first: if any run is
  #     already archived for today at or after this slot's window opened — the trigger's or
  #     a manual one — every delivery step is skipped.
  #
  # Not holiday-aware: the backend trigger skips market holidays and this does not, so a
  # holiday can produce one quiet report. That is the accepted cost of the net.
  schedule:
    - cron: "15 5 * * 1-5"    # 10:45 IST — after the 09:00-10:30 morning window closes
    - cron: "45 10 * * 1-5"   # 16:15 IST — after the 15:00-16:00 afternoon window closes
  workflow_dispatch:
    inputs:
      slot:
        description: "Which of the day's runs this is"
        type: choice
        options:
          - manual
          - morning
          - afternoon
        default: manual
      dry_run:
        description: "Dry run (build the report, send nothing)"
        type: boolean
        default: false

concurrency:
  group: pravesh-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: Scrape · score · deliver
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Which of the day's runs this is. A dispatch says so explicitly; a schedule carries
      # no inputs, so the slot comes from WHICH cron fired. Anything started some other way
      # is labelled `morning` rather than left unlabelled.
      SLOT: ${{ inputs.slot || (github.event.schedule == '45 10 * * 1-5' && 'afternoon') || 'morning' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Only the safety net asks permission. A dispatch — by hand or from the backend
      # trigger — always runs: someone asked for this report on purpose.
      - name: Has this slot already been delivered today?
        id: guard
        if: github.event_name == 'schedule'
        run: python scripts/slot_guard.py --slot "$SLOT"

      - name: Run Pravesh
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        env:
          PRAVESH_SLOT: ${{ env.SLOT }}
          # Delivery
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Store — leave PRAVESH_STORE unset for the default JSON store
          PRAVESH_STORE: ${{ vars.PRAVESH_STORE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PRAVESH_LOG_LEVEL: INFO
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      - name: Commit results (JSON store only)
        if: ${{ vars.PRAVESH_STORE != 'supabase' && inputs.dry_run != true && (github.event_name != 'schedule' || steps.guard.outputs.run == 'true') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name  "pravesh-bot"
          git config user.email "pravesh-bot@users.noreply.github.com"

          # These files are regenerated in full every run, so a line-by-line merge of them is
          # meaningless — it only manufactures conflicts. We therefore never rebase or merge
          # them. Instead: park this run's files, hard-reset onto the branch tip, drop the
          # files back on top, and fold the branch's accumulated ledger back in (so "ours"
          # is always a superset, never a truncation of history). Then commit and push.
          STAGE="${RUNNER_TEMP}/pravesh-data"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/history"
          cp data/verdicts.json data/source_calls.json data/latest.json "$STAGE"/
          # data/history/ holds one payload per (date, slot) — this run's snapshot plus every
          # earlier one. Each file is written once and never edited, so the union of ours and
          # the branch's is always the right answer; reconcile_data.py prunes the old tail.
          [ -d data/history ] && cp -R data/history/. "$STAGE/history/" || true

          for attempt in 1 2 3; do
            git fetch --quiet origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git reset --quiet --hard "origin/${BRANCH}"
            cp "$STAGE"/*.json data/
            mkdir -p data/history
            cp -R "$STAGE/history/." data/history/ 2>/dev/null || true
            python scripts/reconcile_data.py --ref "origin/${BRANCH}"

            git add data/verdicts.json data/source_calls.json data/latest.json data/history
            if git diff --staged --quiet; then
              echo "No data changes to commit."
              exit 0
            fi

            git commit --quiet -m "data: pravesh run $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push --quiet origin "HEAD:${BRANCH}"; then
              echo "Pushed data update on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt} — refetching and replaying."
          done

          # The report has already been delivered by this point, so a stubborn push race is
          # not a failed run — failing here would fire the "failed before delivering" email.
          echo "::warning::Could not push data updates after 3 attempts; tomorrow's run will carry them."

      - name: Upload dry-run preview
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: pravesh-preview
          path: out/pravesh_preview.html
          if-no-files-found: ignore

  notify-failure:
    name: Email failure notice
    runs-on: ubuntu-latest
    needs: run
    if: failure()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # src.report.__init__ pulls in telegram_ping, which imports requests — without this
      # the failure notice dies on ModuleNotFoundError and the breakage stays silent.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send plain-text failure notice
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python - <<'PY'
          from src.report.email_builder import send_failure_notice
          import os
          run_url = (
              f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
              f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID', '')}"
          )
          send_failure_notice(f"The daily job failed before delivering a report.\n\nRun log: {run_url}")
          PY
